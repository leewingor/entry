<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>请用浏览器打开</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#141b28;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.guide{min-height:100dvh;padding:24px 22px 42px;position:relative;text-align:center}.arrow{position:absolute;right:26px;top:8px;color:#1673e8;font-size:72px;line-height:1;transform:rotate(-18deg)}h1{font-size:30px;margin:88px 0 22px;font-weight:750}.hint{font-size:19px;line-height:1.85;margin:0 0 26px}.hint strong{color:#1673e8}.demo{background:#f1f3f6;border-radius:18px;padding:20px 14px 25px;margin:0 auto 28px;max-width:460px;box-shadow:inset 0 0 0 1px #e5e8ed}.demo-title{color:#737b89;margin-bottom:17px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{background:#fff;border-radius:12px;padding:13px 2px;font-size:12px;color:#526070}.tile .symbol{font-size:26px;display:block;margin-bottom:7px}.tile.active{outline:3px solid #2377f1;color:#1765cf;font-weight:bold}.btn{display:block;border:0;border-radius:13px;background:#1673e8;color:#fff;padding:15px 16px;font-size:17px;font-weight:700;text-decoration:none;width:100%;max-width:460px;margin:12px auto;cursor:pointer}.btn.secondary{background:#eef4ff;color:#1765cf}.target{font-size:12px;overflow-wrap:anywhere;color:#697586;margin:24px auto 10px;max-width:460px}.note{font-size:12px;line-height:1.7;color:#77808d;max-width:460px;margin:16px auto}.error{color:#bd2525;font-size:15px}.hidden{display:none}@media(max-width:380px){h1{font-size:26px}.hint{font-size:17px}.arrow{font-size:58px}}
</style>
</head>
<body>
<main class="guide">
<div class="arrow" aria-hidden="true">↗</div>
<h1>请用浏览器打开</h1>
<p class="hint">请点击屏幕右上角 <strong>···</strong><br>选择 <strong>“在浏览器打开”</strong><br><span id="extra">如无此选项，请复制网址后粘贴到浏览器</span></p>
<div class="demo" aria-label="操作示意图">
<div class="demo-title">操作示意（不同版本菜单可能不同）</div>
<div class="tiles"><div class="tile"><span class="symbol">☆</span>收藏</div><div class="tile"><span class="symbol">🔗</span>复制链接</div><div class="tile"><span class="symbol">↗</span>分享</div><div class="tile active"><span class="symbol">🌐</span>浏览器打开</div></div>
</div>
<p id="status" class="error hidden"></p>
<button class="btn" id="copy">复制官网网址</button>
<a class="btn secondary" id="visit" href="#" rel="noopener noreferrer">访问官方网站</a>
<div class="target" id="target"></div>
<p class="note">仅访问您信任的网站。外部浏览器可能仍会进行安全检测，请勿忽略真实的风险提示。</p>
</main>
<script>
(function(){
'use strict';
const allowed=new Set(['bm.jdfree.ccwu.cc']);
const fallback='https://bm.jdfree.ccwu.cc/';
const query=new URLSearchParams(location.search).get('url');
let target;
try{
  target=new URL(query||fallback);
  if(target.protocol!=='https:' || !allowed.has(target.hostname.toLowerCase()) || target.username || target.password || (target.port && target.port!=='443')) throw Error('invalid');
}catch(e){
  document.getElementById('status').textContent='目标地址不在允许访问的官网域名列表中。';
  document.getElementById('status').classList.remove('hidden');
  document.getElementById('copy').disabled=true;
  document.getElementById('visit').removeAttribute('href');
  document.getElementById('visit').style.pointerEvents='none';
  return;
}
const url=target.href;
document.getElementById('target').textContent='目标网址：'+url;
document.getElementById('visit').href=url;
document.getElementById('copy').addEventListener('click',async function(){
  try{await navigator.clipboard.writeText(url);this.textContent='已复制官网网址';}
  catch(e){window.prompt('请复制以下网址：',url);}
});
const ua=navigator.userAgent;
const embedded=/MicroMessenger|QQ\//i.test(ua) || (/\bQQ\b/i.test(ua) && /Android/i.test(ua));
if(/iPhone|iPad|iPod/i.test(ua)) document.getElementById('extra').textContent='如无此选项，请复制官网网址并在Safari中打开';
if(!embedded) location.replace(url);
})();
</script>
</body>
</html>
