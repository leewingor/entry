<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>官方网站访问入口</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17263d;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,480px);background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:30px 24px;box-shadow:0 12px 36px #20385812}h1{font-size:24px;margin:0 0 14px}p{line-height:1.8;color:#475569}.tip{background:#eff6ff;padding:16px;border-radius:10px;line-height:1.8;color:#244c7c}.url{overflow-wrap:anywhere;font-size:13px;color:#64748b;margin:16px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button,a.btn{border:0;border-radius:9px;padding:12px 18px;font-size:15px;text-decoration:none;cursor:pointer;background:#1769d2;color:#fff}button.secondary{background:#edf2f7;color:#203858}.small{font-size:13px}#error{color:#b42318}
</style>
</head>
<body>
<main class="card">
<h1>官方网站访问入口</h1>
<p id="status">正在检查访问链接……</p>
<div id="tip" class="tip" hidden></div>
<div id="url" class="url" hidden></div>
<p id="error" hidden></p>
<div class="actions" id="actions" hidden>
<button type="button" id="copy">复制官网地址</button>
<a class="btn" id="visit" rel="noopener noreferrer" href="#">访问官方网站</a>
</div>
<p class="small">请确认访问地址属于您信任的官方网站。如浏览器提示安全风险，请勿忽略警告。</p>
</main>
<script>
'use strict';
// 必须改成你自己的域名，多个域名用英文逗号隔开。
const ALLOWED_HOSTS = ['bm.jdfree.ccwu.cc'];
const params = new URLSearchParams(window.location.search);
const raw = params.get('url');
const status = document.getElementById('status');
const tip = document.getElementById('tip');
const urlBox = document.getElementById('url');
const error = document.getElementById('error');
const actions = document.getElementById('actions');
const visit = document.getElementById('visit');
const ua = navigator.userAgent.toLowerCase();
const isWeChat = ua.includes('micromessenger');
const isQQ = ua.includes('qq/') || ua.includes(' qq');
const isIOS = /iphone|ipad|ipod/.test(ua);
let target;
try {
  if (!raw) throw new Error('分享链接缺少 url 参数。');
  target = new URL(raw);
  if (target.protocol !== 'https:' || !ALLOWED_HOSTS.includes(target.hostname.toLowerCase()) || target.username || target.password || (target.port && target.port !== '443')) {
    throw new Error('目标网址不在允许访问的官网域名列表中。');
  }
  visit.href = target.href;
  urlBox.textContent = '目标网址：' + target.href;
  urlBox.hidden = false;
  actions.hidden = false;
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(target.href); status.textContent = '官网地址已复制。'; }
    catch(e) { status.textContent = '复制失败，请长按下方网址手动复制。'; }
  });
  if (isWeChat || isQQ) {
    status.textContent = '当前为应用内置浏览器。';
    tip.textContent = isIOS
      ? '请点击右上角菜单，选择“在 Safari 中打开”或其他外部浏览器选项。若没有此选项，可复制官网地址后在 Safari 中粘贴访问。'
      : '请点击右上角菜单，选择“在浏览器打开”。如果没有此选项，请复制官网地址并在系统浏览器中粘贴访问。';
    tip.hidden = false;
  } else {
    status.textContent = '正在前往官方网站……';
    window.location.replace(target.href);
  }
} catch (e) {
  status.textContent = '无法打开此分享链接。';
  error.textContent = e.message;
  error.hidden = false;
}
</script>
</body>
</html>
